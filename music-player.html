    chapterEmptyEl.style.display = 'none';
    currentChapters.forEach(function (ch, index) {
      var li = document.createElement('li');
      li.className = 'chapter-item' +
        (index === currentChapterIndex ? ' active' : '') +
        (isChapterFavorited(currentTrackId, currentTrack ? currentTrack.src : '', ch.startMs) ? ' favorited' : '');
      var t = document.createElement('div');
      t.className = 'chapter-title';
      t.textContent = ch.title;
      var tm = document.createElement('div');
      tm.className = 'chapter-time';
      if (ch.endMs != null && ch.endMs > ch.startMs) {
        tm.textContent = fmt((ch.endMs - ch.startMs) / 1000);
      } else {
        tm.textContent = '—';
      }
      li.appendChild(t);
      li.appendChild(tm);
      li.addEventListener('click', function () {
        onChapterClick(index);
      });
      chapterListEl.appendChild(li);
    });
    updateChapterHighlight();
  }

  function updateChapterFavoriteMarks() {
    if (favoritesView) return;
    var items = chapterListEl.querySelectorAll('.chapter-item');
    items.forEach(function (el, i) {
      var ch = currentChapters[i];
      if (!ch) return;
      el.classList.toggle('favorited',
        isChapterFavorited(currentTrackId, currentTrack ? currentTrack.src : '', ch.startMs));
    });
  }

  function renderFavorites() {
    chapterTitleEl.textContent = '我的收藏';
    chapterCountEl.textContent = favorites.length;
    chapterListEl.innerHTML = '';
    if (!favorites.length) {
      chapterEmptyEl.style.display = 'block';
      chapterEmptyEl.textContent = '还没有收藏，播放歌曲时点右上角的 ♡ 收藏';
      return;
    }
    chapterEmptyEl.style.display = 'none';
    favorites.forEach(function (fav) {
      var track = findTrackForFavorite(fav);
      var li = document.createElement('li');
      li.className = 'chapter-item favorite-item' +
        (isFavoritePlaying(fav) ? ' active' : '') +
        (track ? '' : ' unavailable');
      li.setAttribute('data-fav-key', favoriteKey(fav.trackId, fav.startMs));
      var main = document.createElement('div');
      main.className = 'chapter-main';
      var title = document.createElement('div');
      title.className = 'chapter-title';
      title.textContent = fav.title;
      var sub = document.createElement('div');
      sub.className = 'chapter-sub';
      sub.textContent = track ? track.name : ((fav.trackName || '未知专辑') + '（专辑文件已移除）');
      main.appendChild(title);
      main.appendChild(sub);
      var tm = document.createElement('div');
      tm.className = 'chapter-time';
      if (fav.endMs != null && fav.endMs > fav.startMs) {
        tm.textContent = fmt((fav.endMs - fav.startMs) / 1000);
      } else {
        tm.textContent = '—';
      }
      li.appendChild(main);
      li.appendChild(tm);
      li.addEventListener('click', function () { playFavorite(fav); });
      chapterListEl.appendChild(li);
    });
    updateFavoriteHighlight();
  }

  function renderRightPanel() {
    if (favoritesView) renderFavorites();
    else renderChapters();
    updateFavoriteButton();
  }

  function updateChapterHighlight() {
    var items = chapterListEl.querySelectorAll('.chapter-item');
    items.forEach(function (el, i) {
      el.classList.toggle('active', i === currentChapterIndex);
    });
  }

  function updateFavoriteHighlight() {
    var items = chapterListEl.querySelectorAll('.favorite-item');
    items.forEach(function (el, i) {
      var fav = favorites[i];
      if (fav) el.classList.toggle('active', isFavoritePlaying(fav));
    });
  }

  function updateRightHighlight() {
    if (favoritesView) updateFavoriteHighlight();
    else updateChapterHighlight();
  }

  /* ---------------- 长按拖动排序 ---------------- */
  function clearPress() {
    if (pressState && pressState.timer) clearTimeout(pressState.timer);
    pressState = null;
    document.removeEventListener('pointermove', onPressMove);
    document.removeEventListener('pointerup', onPressEnd);
    document.removeEventListener('pointercancel', onPressEnd);
  }

  function onItemPointerDown(e, id) {
    if (e.button != null && e.button !== 0) return;
    closeItemMenu();
    if (pressState) clearPress();
    pressState = {
      id: id,
      startX: e.clientX,
      startY: e.clientY,
      lastX: e.clientX,
      lastY: e.clientY,
      timer: setTimeout(function () {
        if (!pressState) return;
        beginDrag(pressState.id, pressState.lastX, pressState.lastY);
      }, LONG_PRESS_MS)
    };
    document.addEventListener('pointermove', onPressMove, { passive: false });
    document.addEventListener('pointerup', onPressEnd);
    document.addEventListener('pointercancel', onPressEnd);
  }

  function beginDrag(id, x, y) {
    if (!pressState || pressState.id !== id) return;
    pressState.timer = null;
    var el = getTrackEl(id);
    if (!el) { clearPress(); return; }
    dragState = { id: id, x: x, y: y, moved: false };
    document.body.classList.add('dragging-track');
    document.addEventListener('touchmove', preventTouchScroll, { passive: false });
    window.addEventListener('blur', onPressEnd);
    el.classList.add('dragging');
    updateDragPosition(x, y);
    startAutoScroll();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }

  function onPressMove(e) {
    if (pressState) {
      pressState.lastX = e.clientX;
      pressState.lastY = e.clientY;
    }
    if (!dragState) {
      if (pressState) {
        var dx = e.clientX - pressState.startX;
        var dy = e.clientY - pressState.startY;
        if (Math.abs(dx) > MOVE_TOLERANCE || Math.abs(dy) > MOVE_TOLERANCE) {
          clearPress();
        }
      }
      return;
    }
    if (e.cancelable) e.preventDefault();
    dragState.moved = true;
    handleDragMove(e.clientX, e.clientY);
  }

  function onPressEnd() {
    stopAutoScroll();
    document.removeEventListener('touchmove', preventTouchScroll);
    window.removeEventListener('blur', onPressEnd);
    if (dragState) {
      var el = getTrackEl(dragState.id);
      if (el) {
        var firstRect = el.getBoundingClientRect();
        el.classList.remove('dragging');
        el.style.transform = '';
        var lastRect = el.getBoundingClientRect();
        var dropDx = firstRect.left - lastRect.left;
        var dropDy = firstRect.top - lastRect.top;
        if (el.animate && (Math.abs(dropDx) > 1 || Math.abs(dropDy) > 1)) {
          el.animate([
            { transform: 'translate(' + dropDx + 'px,' + dropDy + 'px)' },
            { transform: 'translate(0,0)' }
          ], { duration: 170, easing: 'cubic-bezier(.2,.8,.25,1)' });
        }
      }
      document.body.classList.remove('dragging-track');
      dragState = null;
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 350);
      saveStore();
    }
    clearPress();
  }

  function handleDragMove(x, y) {
    if (!dragState) return;
    dragState.x = x;
    dragState.y = y;
    var from = indexOfTrack(dragState.id);
    if (from < 0) return;
    var to = getDropIndex(y, from);
    if (to !== from && to !== -1) {
      var target = to > from ? to - 1 : to;
      if (target < 0) target = 0;
      if (target !== from) {
        var tops = captureItemTops();
        var moved = tracks.splice(from, 1)[0];
        tracks.splice(target, 0, moved);
        moveTrackNode(dragState.id, from, target);
        animateMovedItems(tops);
      }
    }
    updateDragPosition(x, y);
  }

  /* 只移动被拖动项以外的节点，让拖动项的 DOM 节点保持不动，
     避免重新渲染导致移动端触摸指针捕获丢失、越过其他项时拖动中断 */
  function moveTrackNode(id, from, target) {
    var el = getTrackEl(id);
    if (!el) return;
    var kids = listEl.children;
    if (target > from) {
      for (var i = from + 1; i <= target; i++) {
        listEl.insertBefore(kids[i], el);
      }
    } else if (target < from) {
      for (var j = from - 1; j >= target; j--) {
        listEl.insertBefore(kids[j], el.nextSibling);
      }
    }
  }

  /* 记录各项拖动前的视觉位置，供 FLIP 动画使用 */
  function captureItemTops() {
    var tops = {};
    var nodes = listEl.children;
    for (var i = 0; i < nodes.length; i++) {
      var id = nodes[i].getAttribute('data-id');
      if (!id) continue;
      var r = nodes[i].getBoundingClientRect();
      tops[id] = { top: r.top, left: r.left };
    }
    return tops;
  }

  /* 重排后让位置变化的项从旧位置滑到新位置 */
  function animateMovedItems(tops) {
    if (!tops) return;
    var nodes = listEl.children;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var id = el.getAttribute('data-id');
      if (!id || (dragState && id === dragState.id) || !el.animate) continue;
      var first = tops[id];
      if (!first) continue;
      if (el._flipAnim) {
        try { el._flipAnim.cancel(); } catch (e) {}
        el._flipAnim = null;
      }
      var r = el.getBoundingClientRect();
      var dx = first.left - r.left;
      var dy = first.top - r.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
      el._flipAnim = el.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px)' },
        { transform: 'translate(0,0)' }
      ], { duration: 170, easing: 'cubic-bezier(.2,.8,.25,1)' });
    }
  }

  function getDropIndex(y, from) {
    var nodes = listEl.children;
    /* 用布局位置计算落点，避免被移动动画的 transform 干扰 */
    var base = listEl.getBoundingClientRect().top - listEl.offsetTop;
    for (var i = 0; i < nodes.length; i++) {
      if (i === from) continue;
      var el = nodes[i];
      var mid = base + el.offsetTop + el.offsetHeight / 2;
      if (y < mid) return i;
    }
    return nodes.length;
  }

  function updateDragPosition(x, y) {
    if (!dragState) return;
    var el = getTrackEl(dragState.id);
    if (!el) return;
    el.style.transform = 'none';
    var rect = el.getBoundingClientRect();
    var centerY = rect.top + rect.height / 2;
    var dy = y - centerY;
    el.style.transform = 'translateY(' + dy + 'px)';
  }

  /* 拖动时阻止浏览器接管手势（避免拖动被原生滚动打断） */
  function preventTouchScroll(e) {
    if (dragState && e.cancelable) e.preventDefault();
  }
  /* 在触摸开始前就注册非被动监听：移动端浏览器才会等待 JS 判断是否拖动，
     否则长按后竖向滑动会先触发原生滚动并发出 pointercancel */
  listEl.addEventListener('touchmove', preventTouchScroll, { passive: false });

  /* 找到列表所在的可滚动容器；没有则用页面滚动 */
  function findScrollBox() {
    var box = listEl.parentElement;
    while (box && box !== document.body && box !== document.documentElement) {
      var oy = window.getComputedStyle(box).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay' || oy === 'hidden') &&
          box.scrollHeight - box.clientHeight > 1) {
        return box;
      }
      box = box.parentElement;
    }
    return null;
  }

  function startAutoScroll() {
    stopAutoScroll();
    autoScrollLastTs = 0;
    autoScrollRaf = requestAnimationFrame(autoScrollFrame);
  }

  function stopAutoScroll() {
    if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
    autoScrollRaf = 0;
    autoScrollLastTs = 0;
  }

  function autoScrollFrame(ts) {
    if (!dragState) { autoScrollRaf = 0; return; }
    var dt = autoScrollLastTs ? Math.min(ts - autoScrollLastTs, 50) : 16.7;
    autoScrollLastTs = ts;
    if (autoScrollTick(dt)) {
      /* 滚动后列表位置变了，重新计算落点与拖拽元素位置 */
      handleDragMove(dragState.x, dragState.y);
    }
    autoScrollRaf = requestAnimationFrame(autoScrollFrame);
  }

  function autoScrollTick(dt) {
    if (!dragState || !dragState.moved) return false;
    var box = findScrollBox();
    var top, bottom, left, right;
    if (box) {
      var r = box.getBoundingClientRect();
      top = r.top; bottom = r.bottom; left = r.left; right = r.right;
    } else {
      top = 0;
      bottom = window.innerHeight;
      left = 0;
      right = window.innerWidth;
    }

    var x = dragState.x;
    var y = dragState.y;
    /* 指针横向离开列表区域时不自动滚动 */
    if (x < left - 60 || x > right + 60) return false;

    var dir = 0;
    if (y < top + AUTO_SCROLL_EDGE) dir = -1;
    else if (y > bottom - AUTO_SCROLL_EDGE) dir = 1;
    if (!dir) return false;

    var depth = dir < 0 ? top + AUTO_SCROLL_EDGE - y : y - (bottom - AUTO_SCROLL_EDGE);
    var ratio = Math.max(0, Math.min(1, depth / AUTO_SCROLL_EDGE));
    var step = Math.max(1, ratio * AUTO_SCROLL_MAX_STEP) * dir * (dt / 16.7);

    if (box) {
      var before = box.scrollTop;
      box.scrollTop = before + step;
      return Math.abs(box.scrollTop - before) >= 0.5;
    }

    /* 页面滚动：已在顶部/底部时无需再滚 */
    var pageBefore = window.pageYOffset;
    var maxY = (document.scrollingElement || document.documentElement).scrollHeight - window.innerHeight;
    if ((dir > 0 && pageBefore >= maxY - 1) || (dir < 0 && pageBefore <= 0.5)) return false;

    window.scrollBy(0, step);
    if (Math.abs(window.pageYOffset - pageBefore) >= 0.5) return true;

    /* 拖动时 body 锁定为 overflow:hidden，个别浏览器会忽略程序化滚动，临时解锁再滚一次 */
    var body = document.body;
    if (window.getComputedStyle(body).overflowY !== 'hidden') return false;
    body.style.overflow = 'auto';
    void body.offsetHeight;
    try {
      window.scrollBy(0, step);
    } finally {
      body.style.overflow = '';
    }
    return Math.abs(window.pageYOffset - pageBefore) >= 0.5;
  }

  /* ---------------- 章节点击与播放 ---------------- */
  function onChapterClick(index) {
    if (index < 0 || index >= currentChapters.length) return;

    if (currentMode() === 'shuffle') {
      if (shuffleQueue.length !== currentChapters.length) {
        buildShuffleQueue(index);
      } else {
        var pos = shuffleQueue.indexOf(index);
        if (pos >= 0) shufflePos = pos;
        else buildShuffleQueue(index);
      }
    }

    if (index === currentChapterIndex) {
      if (isFading) {
        cancelFade();
        audio.volume = savedVolume / 100;
        if (audio.paused) audio.play().catch(function () {});
        return;
      }
      if (!audio.paused) fadeOutAndPause();
      else audio.play().catch(function () {});
      return;
    }

    playChapter(index, true);
  }

  async function loadAlbum(trackId, targetStartMs) {
    var t = findTrack(trackId);
    if (!t) return;
    var token = ++albumLoadToken;

    cancelFade();
    closeItemMenu();
    pendingSleepPause = false;
    currentTrackId = trackId;
    currentTrack = t;
    currentChapters = [];
    currentChapterIndex = -1;
    shuffleQueue = [];
    shufflePos = -1;

    audio.pause();
    audio.src = t.src;
    audio.load();
    audio.volume = savedVolume / 100;

    nowPlayingEl.textContent = t.name;
    setProgressValue('0');
    currentTimeEl.textContent = '0:00';
    totalTimeEl.textContent = '0:00';
    playBtn.innerHTML = SVG_PLAY;
    playBtn.setAttribute('aria-label', '播放');

    if (!favoritesView) {
      renderTrackList();
      renderRightPanel();
    } else {
      updateFavoriteHighlight();
      updateFavoriteButton();
    }

    var parsed = await loadChaptersCached(t);
    if (token !== albumLoadToken) return;

    if (parsed.length > 0) {
      currentChapters = parsed;
    } else {
      currentChapters = [{ title: t.name, startMs: 0, endMs: null, virtual: true }];
    }

    var startIndex = 0;
    if (targetStartMs != null && isFinite(targetStartMs)) {
      var found = findChapterIndex(currentChapters, targetStartMs);
      if (found >= 0) {
        startIndex = found;
      } else {
        toast('未找到收藏的章节，已从第一首开始');
      }
    }

    if (currentMode() === 'shuffle') {
      buildShuffleQueue(startIndex);
    }

    currentChapterIndex = startIndex;
    if (favoritesView) {
      updateFavoriteHighlight();
      updateFavoriteButton();
    } else {
      renderRightPanel();
    }
    playChapter(startIndex, true);
  }

  function playChapter(index, autoplay) {
    if (index < 0 || index >= currentChapters.length) return;
    pendingSleepPause = false;
    currentChapterIndex = index;
    var ch = currentChapters[index];

    nowPlayingEl.textContent = ch.title;
    updateRightHighlight();
    updateFavoriteButton();
    updateMediaSession(ch.title, currentTrack ? currentTrack.name : '');

    var startSec = ch.startMs / 1000;

    function apply() {
      seekingByChapter = true;
      audio.currentTime = startSec;
      audio.volume = savedVolume / 100;
      setTimeout(function () { seekingByChapter = false; }, 120);
      if (autoplay) {
        audio.play().catch(function (err) {
          if (err && err.name === 'NotAllowedError') toast('请再点一次播放按钮');
          else toast('播放失败：' + ((err && err.message) || '未知错误'));
        });
      }
      updateProgressUI();
    }

    if (audio.readyState >= 1) {
      apply();
    } else {
      var onMeta = function () {
        audio.removeEventListener('loadedmetadata', onMeta);
        apply();
      };
      audio.addEventListener('loadedmetadata', onMeta);
    }
  }

  function togglePlay() {
    if (!currentTrackId) {
      if (favoritesView && favorites.length && playFavorite(favorites[0])) return;
      favoritesView = false;
      favoritesPlayback = false;
      renderFavoritesCard();
      renderRightPanel();
      if (tracks.length) loadAlbum(tracks[0].id);
      else toast('列表是空的');
      return;
    }
    pendingSleepPause = false;
    if (isFading) {
      cancelFade();
      audio.volume = savedVolume / 100;
      if (audio.paused) audio.play().catch(function () {});
      return;
    }
    if (audio.paused) {
      if (currentChapterIndex >= 0 && currentChapters.length > 0) {
        var ch = currentChapters[currentChapterIndex];
        var startSec = ch.startMs / 1000;
        var endSec = ch.endMs != null ? ch.endMs / 1000 : audio.duration;
        if (isFinite(endSec) && (audio.currentTime >= endSec - 0.05 || audio.currentTime < startSec)) {
          audio.currentTime = startSec;
        }
      }
      audio.volume = savedVolume / 100;
      audio.play().catch(function () {});
    } else {
      fadeOutAndPause();
    }
  }

  function playPrev() {
    if (favoritesPlayback) {
      if (currentFavoriteIndex() >= 0) {
        if (!playFavoriteByOffset(-1)) toast('已经是第一个收藏了');
        return;
      }
      favoritesPlayback = false;
    }
    if (!currentTrackId) return;
    var idx = getNextChapterIndex(-1);
    if (idx >= 0) playChapter(idx, true);
    else toast('已经是第一个了');
  }

  function playNext() {
    if (favoritesPlayback) {
      if (currentFavoriteIndex() >= 0) {
        if (!playFavoriteByOffset(1)) toast('已经是最后一个收藏了');
        return;
      }
      favoritesPlayback = false;
    }
    if (!currentTrackId) return;
    var idx = getNextChapterIndex(1);
    if (idx >= 0) playChapter(idx, true);
    else toast('已经是最后一个了');
  }

  function handleChapterEnded() {
    if (chapterEndedHandled) return;
    chapterEndedHandled = true;
    setTimeout(function () { chapterEndedHandled = false; }, 150);

    if (pendingSleepPause) {
      pendingSleepPause = false;
      fadeOutAndPause();
      toast('定时到点，已暂停播放');
      return;
    }

    if (currentChapterIndex < 0 || currentChapters.length === 0) return;
    var mode = currentMode();

    if (mode === 'repeatOne') {
      var ch = currentChapters[currentChapterIndex];
      seekingByChapter = true;
      audio.currentTime = ch.startMs / 1000;
      setTimeout(function () { seekingByChapter = false; }, 120);
      audio.play().catch(function () {});
      return;
    }

    if (favoritesPlayback && currentFavoriteIndex() >= 0) {
      if (playFavoriteByOffset(1)) return;
      audio.pause();
      var fc = currentChapters[currentChapterIndex];
      var fEnd = fc.endMs != null ? fc.endMs / 1000 : audio.duration;
      if (isFinite(fEnd)) audio.currentTime = fEnd;
      updateProgressUI();
      return;
    }

    var nextIdx = getNextChapterIndex(1);
    if (nextIdx < 0 && mode === 'shuffle' && currentChapters.length > 0) {
      buildShuffleQueue(null);
      shufflePos = 0;
      nextIdx = shuffleQueue.length > 0 ? shuffleQueue[0] : -1;
    }
    if (nextIdx >= 0) {
      playChapter(nextIdx, true);
    } else {
      audio.pause();
      var c = currentChapters[currentChapterIndex];
      var endSec = c.endMs != null ? c.endMs / 1000 : audio.duration;
      if (isFinite(endSec)) audio.currentTime = endSec;
      updateProgressUI();
    }
  }

  function removeTrack(id) {
    cancelFade();
    closeItemMenu();
    var idx = indexOfTrack(id);
    if (idx < 0) return;
    var t = tracks[idx];
    if (t.kind === 'blob') {
      try { URL.revokeObjectURL(t.src); } catch (e) {}
    }
    tracks.splice(idx, 1);
    if (t.kind === 'url') saveStore();
    delete chapterCache[id];
    delete chapterLoads[id];

    if (currentTrackId === id) {
      favoritesPlayback = false;
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      currentTrackId = null;
      currentTrack = null;
      currentChapters = [];
      currentChapterIndex = -1;
      shuffleQueue = [];
      shufflePos = -1;
      pendingSleepPause = false;
      nowPlayingEl.textContent = '未选择音频';
      playBtn.innerHTML = SVG_PLAY;
      playBtn.setAttribute('aria-label', '播放');
      setProgressValue('0');
      currentTimeEl.textContent = '0:00';
      totalTimeEl.textContent = '0:00';
      updateFavoriteButton();
    }
    renderTrackList();
    renderRightPanel();
  }

  function updateProgressUI() {
    if (currentChapterIndex < 0 || currentChapters.length === 0) {
      var dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      var pv = dur > 0 ? Math.round(audio.currentTime / dur * 1000) : 0;
      setProgressValue(String(pv));
      currentTimeEl.textContent = fmt(audio.currentTime);
      totalTimeEl.textContent = fmt(dur);
      return;
    }
    var ch = currentChapters[currentChapterIndex];
    var startSec = ch.startMs / 1000;
    var endSec = ch.endMs != null ? ch.endMs / 1000 : audio.duration;
    if (!isFinite(endSec)) endSec = startSec;
    var cur = Math.max(0, Math.min(audio.currentTime, endSec) - startSec);
    var dur2 = endSec - startSec;
    var pv2 = dur2 > 0 ? Math.round(cur / dur2 * 1000) : 0;
    setProgressValue(String(pv2));
    currentTimeEl.textContent = fmt(cur);
    totalTimeEl.textContent = fmt(dur2);
  }

  audio.addEventListener('play', function () {
    recordIcon.classList.add('playing');
    playBtn.innerHTML = SVG_PAUSE;
    playBtn.setAttribute('aria-label', '暂停');
    requestWakeLock();
  });
  audio.addEventListener('pause', function () {
    recordIcon.classList.remove('playing');
    playBtn.innerHTML = SVG_PLAY;
    playBtn.setAttribute('aria-label', '播放');
  });
  audio.addEventListener('timeupdate', function () {
    if (seekDragging) return;

    if (currentChapterIndex < 0 || currentChapters.length === 0) {
      updateProgressUI();
      return;
    }

    var ch = currentChapters[currentChapterIndex];
    var startSec = ch.startMs / 1000;
    var endSec = ch.endMs != null ? ch.endMs / 1000 : audio.duration;

    if (!audio.paused && !seekingByChapter && isFinite(endSec) && audio.currentTime >= endSec - 0.05) {
      handleChapterEnded();
      return;
    }

    if (!isFinite(endSec)) endSec = startSec;
    var cur = Math.max(0, Math.min(audio.currentTime, endSec) - startSec);
    var dur = endSec - startSec;
    var pv = dur > 0 ? Math.round(cur / dur * 1000) : 0;
    setProgressValue(String(pv));
    currentTimeEl.textContent = fmt(cur);
    totalTimeEl.textContent = fmt(dur);
  });
  audio.addEventListener('loadedmetadata', function () {
    updateProgressUI();
  });
  audio.addEventListener('durationchange', function () {
    updateProgressUI();
  });
  audio.addEventListener('ended', function () {
    playBtn.innerHTML = SVG_PLAY;
    playBtn.setAttribute('aria-label', '播放');
    if (currentChapterIndex < 0 || currentChapters.length === 0) return;
    chapterEndedHandled = false;
    handleChapterEnded();
  });
  audio.addEventListener('error', function () {
    if (!currentTrackId) return;
    var err = audio.error;
    var msg = '无法加载该音频';
    if (err) {
      if (err.code === 1) msg = '加载被中止';
      else if (err.code === 2) msg = '读取错误：浏览器可能禁止访问 file:/// 路径';
      else if (err.code === 3) msg = '解码失败：格式可能不受支持';
      else if (err.code === 4) msg = '文件不存在或格式不支持';
    }
    toast(msg);
  });

  progressEl.addEventListener('pointerdown', function () { seekDragging = true; });
  progressEl.addEventListener('input', function () {
    seekDragging = true;
    setProgressValue(progressEl.value);
    if (currentChapterIndex >= 0 && currentChapters.length > 0) {
      var ch = currentChapters[currentChapterIndex];
      var startSec = ch.startMs / 1000;
      var endSec = ch.endMs != null ? ch.endMs / 1000 : audio.duration;
      if (!isFinite(endSec)) return;
      var dur = endSec - startSec;
      if (dur > 0) currentTimeEl.textContent = fmt(dur * progressEl.value / 1000);
    } else if (isFinite(audio.duration) && audio.duration > 0) {
      currentTimeEl.textContent = fmt(audio.duration * progressEl.value / 1000);
    }
  });
  progressEl.addEventListener('change', function () {
    if (currentChapterIndex >= 0 && currentChapters.length > 0) {
      var ch = currentChapters[currentChapterIndex];
      var startSec = ch.startMs / 1000;
      var endSec = ch.endMs != null ? ch.endMs / 1000 : audio.duration;
      if (!isFinite(endSec)) { seekDragging = false; return; }
      var dur = endSec - startSec;
      if (dur > 0) {
        seekingByChapter = true;
        audio.currentTime = startSec + dur * progressEl.value / 1000;
        setTimeout(function () { seekingByChapter = false; }, 120);
      }
    } else if (isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = audio.duration * progressEl.value / 1000;
    }
    seekDragging = false;
    updateProgressUI();
  });
  progressEl.addEventListener('pointerup', function () { seekDragging = false; });

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', playPrev);
  nextBtn.addEventListener('click', playNext);

  document.getElementById('addBtn').addEventListener('click', function () {
    var p = document.getElementById('pathInput').value.trim();
    if (!p) { toast('请先输入 file:/// 地址'); return; }
    if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(p) && p.indexOf('content://') !== 0) {
      p = 'file:///' + p.replace(/^\/+/, '');
    }
    var name = nameFromPath(p);
    for (var i = 0; i < tracks.length; i++) {
      if (tracks[i].kind === 'url' && tracks[i].src === p) { toast('该地址已存在'); return; }
    }
    tracks.push({ id: uid(), name: name, src: p, kind: 'url' });
    saveStore();
    renderTrackList();
    if (favoritesView) renderRightPanel();
    closeAddMenu();
    toast('已保存');
  });

  var filePicker = document.getElementById('filePicker');
  document.getElementById('pickBtn').addEventListener('click', function () {
    filePicker.click();
  });
  filePicker.addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    files.forEach(function (f) {
      tracks.push({
        id: uid(),
        name: f.name,
        src: URL.createObjectURL(f),
        kind: 'blob'
      });
    });
    filePicker.value = '';
    renderTrackList();
    if (favoritesView) renderRightPanel();
    closeAddMenu();
    toast('已加入 ' + files.length + ' 个文件');
  });

  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !audio.paused) requestWakeLock();
  });

  function updateMediaSession(chapterTitle, albumName) {
    if (!('mediaSession' in navigator)) return;
    try {
      if (window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: chapterTitle || '未播放',
          artist: '本地文件',
          album: albumName || 'MP3 专辑播放器'
        });
      }
      navigator.mediaSession.setActionHandler('play', function () {
        if (!audio.paused && !isFading) return;
        cancelFade();
        audio.volume = savedVolume / 100;
        audio.play().catch(function () {});
      });
      navigator.mediaSession.setActionHandler('pause', function () {
        if (!audio.paused) fadeOutAndPause();
      });
      navigator.mediaSession.setActionHandler('previoustrack', playPrev);
      navigator.mediaSession.setActionHandler('nexttrack', playNext);
      try {
        navigator.mediaSession.setActionHandler('seekto', function (d) {
          if (!d || typeof d.seekTime !== 'number') return;
          audio.currentTime = d.seekTime;
        });
      } catch (e2) {}
    } catch (e) {}
  }

  loadStore();
  loadFavorites();
  renderTrackList();
  renderChapters();
  updateFavoriteButton();

  window.addEventListener('pagehide', function () {
    cancelFade();
    tracks.forEach(function (t) {
      if (t.kind === 'blob') {
        try { URL.revokeObjectURL(t.src); } catch (e) {}
      }
    });
  });

})();
</script>
</body>
</html>
